server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:./backend/application-local.properties,optional:file:./application-local.properties

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  application:
    name: project_management

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

  data:
    redis:
      url: ${REDIS_URL}
      timeout: 5000ms

app:
  auth:
    quick-login-enabled: ${QUICK_LOGIN_ENABLED:false}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-days: 7
