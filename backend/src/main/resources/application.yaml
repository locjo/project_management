server:
  port: ${PORT:8080}

spring:
  config:
    import: optional:file:./backend/application-local.properties,optional:file:./application-local.properties

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  application:
    name: project_management

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      url: ${REDIS_URL}
      timeout: 5000ms

app:
  auth:
    quick-login-enabled: ${QUICK_LOGIN_ENABLED:false}

  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 3600000
  refresh-token-expiration-days: 7
