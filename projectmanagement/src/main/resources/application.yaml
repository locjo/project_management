spring:
  application:
    name: project_management
  datasource:
    url: jdbc:postgresql://localhost:5432/project_management
    username: postgres
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

jwt:
  secret: "c29tZS1rZXktZm9yLWFwcC1zaWduaW5nLWFuZC1hdXRoZW50aWNhdGlvbg=="
  access-token-expiration-ms: 3600000
  refresh-token-expiration-days: 7